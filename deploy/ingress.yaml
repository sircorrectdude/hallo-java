apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hallo-java
spec:
  ingressClassName: traefik
  rules:
    - host: hallo-java.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hallo-java
                port:
                  number: 80
